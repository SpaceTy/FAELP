DATABASE_URL: "postgresql://app_orgbackend_dev:password@localhost:5432/orgdb_dev?sslmode=disable"
upload_path: "uploads"

# Internal communication config
internal:
  # Unix socket path for inter-service communication
  socket_path: "/tmp/org-backend.sock"
  # Enable/disable Unix socket listener
  socket_enabled: true

# Distribution backend connection
distribution_backend:
  # Unix socket path to connect to dist backend
  socket_path: "/tmp/dist-backend.sock"
  # Distribution center ID that this dist backend represents
  distribution_center_id: "00000000-0000-0000-0000-000000000001"

# Frontend serving configuration
frontend:
  user:
    enabled: true
    port: 8080
    path: "../frontend/user/dist"  # Path to built user frontend
  admin:
    enabled: true
    port: 8082
    path: "../frontend/orgadmin/dist"  # Path to built orgadmin frontend
