version: "3.8"
name: faelp-dist

services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: faelp-dist-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - dist-postgres-data:/var/lib/postgresql/data

  dist-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faelp-dist-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_DISTRIBUTION_ENABLED: ${FRONTEND_DISTRIBUTION_ENABLED}
      FRONTEND_DISTRIBUTION_PORT: ${FRONTEND_DISTRIBUTION_PORT}
      FRONTEND_DISTRIBUTION_PATH: ${FRONTEND_DISTRIBUTION_PATH}
      FRONTEND_ADMIN_ENABLED: ${FRONTEND_ADMIN_ENABLED}
      FRONTEND_ADMIN_PATH: ${FRONTEND_ADMIN_PATH}
      FRONTEND_ADMIN_PORT: ${FRONTEND_ADMIN_PORT}
      INTERNAL_SOCKET_PATH: ${INTERNAL_SOCKET_PATH}
      INTERNAL_SOCKET_ENABLED: ${INTERNAL_SOCKET_ENABLED}
      ORG_BACKEND_SOCKET_PATH: ${ORG_BACKEND_SOCKET_PATH}
      DISTRIBUTION_CENTER_ID: ${DISTRIBUTION_CENTER_ID}
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      UPLOAD_PATH: ${UPLOAD_PATH}
      DB_SSLMODE: ${DB_SSLMODE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${FRONTEND_DISTRIBUTION_PORT}:${FRONTEND_DISTRIBUTION_PORT}"
      - "127.0.0.1:${FRONTEND_ADMIN_PORT}:${FRONTEND_ADMIN_PORT}"
    volumes:
      - socket-volume:/var/run/faelp
      - dist-uploads:/app/uploads
      - ./.env:/app/.env

volumes:
  socket-volume:
    name: ${SOCKET_VOLUME_NAME}
    external: true
  dist-uploads:
    name: ${UPLOADS_VOLUME_NAME}
  dist-postgres-data:
    name: ${POSTGRES_DATA_VOLUME_NAME}
