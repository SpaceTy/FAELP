DATABASE_URL: "postgresql://app_orgbackend_dev:password@postgres:5432/orgdb_dev?sslmode=disable"

internal:
  socket_path: "/var/run/faelp/org-backend.sock"
  socket_enabled: true

distribution_backend:
  socket_path: "/var/run/faelp/dist-backend.sock"
  distribution_center_id: "00000000-0000-0000-0000-000000000001"

frontend:
  user:
    enabled: true
    path: "/app/frontend/user/dist"
  admin:
    enabled: true
    port: 8082
    path: "/app/frontend/orgadmin/dist"
