version: "3.8"

services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: faelp-org-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - org-postgres-data:/var/lib/postgresql/data

  org-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faelp-org-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WORKOS_API_KEY: ${WORKOS_API_KEY}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_USER_ENABLED: ${FRONTEND_USER_ENABLED}
      FRONTEND_USER_PORT: ${FRONTEND_USER_PORT}
      FRONTEND_USER_PATH: ${FRONTEND_USER_PATH}
      FRONTEND_ADMIN_ENABLED: ${FRONTEND_ADMIN_ENABLED}
      FRONTEND_ADMIN_PATH: ${FRONTEND_ADMIN_PATH}
      FRONTEND_ADMIN_PORT: ${FRONTEND_ADMIN_PORT}
      INTERNAL_SOCKET_PATH: ${INTERNAL_SOCKET_PATH}
      INTERNAL_SOCKET_ENABLED: ${INTERNAL_SOCKET_ENABLED}
      DIST_BACKEND_SOCKET_PATH: ${DIST_BACKEND_SOCKET_PATH}
      DIST_BACKEND_CENTER_ID: ${DIST_BACKEND_CENTER_ID}
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      UPLOAD_PATH: ${UPLOAD_PATH}
      DB_SSLMODE: ${DB_SSLMODE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${FRONTEND_USER_PORT}:${FRONTEND_USER_PORT}"
      - "127.0.0.1:${FRONTEND_ADMIN_PORT}:${FRONTEND_ADMIN_PORT}"
    volumes:
      - socket-volume:/var/run/faelp
      - org-uploads:/app/uploads
      - ./.env:/app/.env

volumes:
  socket-volume:
  org-uploads:
  org-postgres-data:
