DATABASE_URL: "postgresql://app_distributionbackend_dev:password@localhost:5432/distdb_dev?sslmode=disable"

# JWT secret for signing tokens - CHANGE THIS IN PRODUCTION
JWT_SECRET: "your-secure-jwt-secret-change-in-production"

# Organization backend configuration
ORGANIZATION_BACKEND_URL: "http://localhost:8080"
ORGANIZATION_BACKEND_API_KEY: "your-api-key-here"

# Organization backend connection (preferred Unix socket)
organization_backend:
  # TCP URL (fallback for multi-server)
  url: "http://localhost:8080"
  # Unix socket path (preferred when on same server)
  socket_path: "/tmp/org-backend.sock"
  # API key (fallback for multi-server)
  api_key: ""

# Internal socket for receiving requests
internal:
  socket_path: "/tmp/dist-backend.sock"
  socket_enabled: true

# Initial admin account - required for first setup
admin:
  username: "admin"
  password: "changeme123"

# Frontend serving configuration
frontend:
  distribution:
    enabled: true
    path: "../frontend/distribution/dist"
  admin:
    enabled: true
    port: 8083
    path: "../frontend/distadmin/dist"
