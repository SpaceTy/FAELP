version: '3.8'

services:
  org-backend:
    build: ./organization_backend
    volumes:
      - socket-volume:/var/run
    environment:
      - DATABASE_URL=${ORG_DATABASE_URL:-postgresql://app_orgbackend_dev:password@host.docker.internal:5432/orgdb_dev?sslmode=disable}
      - JWT_SECRET=${JWT_SECRET:-your-secure-jwt-secret-change-in-production}
      - INTERNAL_SOCKET_PATH=/var/run/org-backend.sock
      - INTERNAL_SOCKET_ENABLED=true
    ports:
      - "8080:8080"

  dist-backend:
    build: ./distribution_backend
    volumes:
      - socket-volume:/var/run
    environment:
      - DATABASE_URL=${DIST_DATABASE_URL:-postgresql://app_distributionbackend_dev:password@host.docker.internal:5432/distdb_dev?sslmode=disable}
      - JWT_SECRET=${JWT_SECRET:-your-secure-jwt-secret-change-in-production}
      - ORG_BACKEND_SOCKET_PATH=/var/run/org-backend.sock
      - INTERNAL_SOCKET_PATH=/var/run/dist-backend.sock
      - INTERNAL_SOCKET_ENABLED=true
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    ports:
      - "8081:8081"
    depends_on:
      - org-backend

volumes:
  socket-volume:
